name: Build and deploy to GitHub Pages

# Builds the site with the app versions in versions.lock.json and publishes it with GitHub Pages
# (Settings → Pages → Source: "GitHub Actions"). Every push builds and smoke-tests; only the default branch
# deploys. New app releases come in through update.yml, which runs this workflow when one lands.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build the site from the latest releases
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Opens every app in headless Chrome under the same /<repo>/ path Pages uses. A failure here is
      # reported (job summary, screenshots artifact) but doesn't hold back the deploy: an upstream release
      # with a problem shouldn't keep every other app from updating.
      - name: Smoke test in Chrome
        continue-on-error: true
        run: node scripts/smoke.mjs --screenshots smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "::error::GitHub Pages isn't enabled for this repository. Turn it on in Settings → Pages → Build and deployment → Source: GitHub Actions, then run this workflow again."
            exit 1
          fi

      - id: deployment
        uses: actions/deploy-pages@v4
